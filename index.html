<style>

@media (prefers-reduced-motion:no-preference){.opt,.btn,nav button{transition:background .15s,border-color .15s}}

<li><b>Certyfikat bezpieczeństwa</b> – „dowód osobisty” strony internetowej, wystawiony przez zaufaną instytucję. Widać go jako kłódkę w przeglądarce.</li>
<li><b>Podpis cyfrowy</b> – elektroniczny podpis. Potwierdza, od kogo pochodzi dokument.</li>
<li><b>Kod ASCII</b> – każdy znak ma swój numer, np. A = 65.</li></ul>
<p class="note">Uwaga: na prawdziwym egzaminie opisy są w innej kolejności. Tam rozwiązanie to: 1–B, 2–D, 3–E, 4–C, 5–H, 6–F, 7–G, 8–A.</p>`,
    de:`<p><b>Lösung:</b> 1–D, 2–H, 3–F, 4–B, 5–A, 6–C, 7–G, 8–E</p><ul>
<li><b>Algorithmus</b> = eine Anleitung wie ein Rezept: Schritte, die zur Lösung führen.</li>
<li>Einen Algorithmus kann man auf drei Arten aufschreiben: <b>in Worten</b> (normale Sprache), als <b>Schrittliste</b> (nummerierte Schritte), als <b>Flussdiagramm</b> (Zeichnung mit Kästchen und Pfeilen).</li>
<li><b>Kryptografie</b> = Nachrichten ver- und entschlüsseln.</li>
<li><b>Sicherheitszertifikat</b> = der „Ausweis“ einer Webseite, ausgestellt von einer vertrauenswürdigen Stelle. Man sieht es am Schloss im Browser.</li>
<li><b>Digitale Signatur</b> = elektronische Unterschrift. Sie beweist, von wem ein Dokument stammt.</li>
<li><b>ASCII-Code</b>: Jedes Zeichen hat eine Nummer, z. B. A = 65.</li></ul>
<p class="note">Achtung: In der echten Prüfung stehen die Beschreibungen in anderer Reihenfolge. Dort ist die Lösung: 1–B, 2–D, 3–E, 4–C, 5–H, 6–F, 7–G, 8–A.</p>`}},

<p class="note">Für die Prüfung: Python, JavaScript, C++ und Java aufschreiben.</p>`}},

{ pts:4, title:{pl:"Wyniki wyszukiwania i przegląd od AI",de:"Suchergebnisse und KI-Übersicht"},
  intro:()=>`<div class="serp">
<div class="bar">🔍&nbsp; ${L({pl:"kto wymyślił www",de:"wer hat das www erfunden"})}</div>
<div class="ai"><b>✦ ${L({pl:"Przegląd od AI",de:"KI-Übersicht"})}</b>${L({pl:"World Wide Web wymyślił Bill Gates w 1995 roku, gdy pracował w Microsofcie.<br>WWW i internet to dokładnie to samo – dwie nazwy jednej sieci.",de:"Das World Wide Web hat Bill Gates im Jahr 1995 erfunden, als er bei Microsoft arbeitete.<br>WWW und Internet sind genau dasselbe – zwei Namen für ein Netz."})}</div>
<div class="res"><div class="t"><span class="num">1</span>${L({pl:"Historia internetu – encyklopedia informatyki",de:"Geschichte des Internets – Informatik-Enzyklopädie"})}</div><div class="u">encyklopedia-przyklad.pl › historia-www</div><div class="d">${L({pl:"World Wide Web stworzył Tim Berners-Lee w 1989 roku w laboratorium CERN w Szwajcarii. Pierwsza strona WWW ruszyła w 1991 roku.",de:"Das World Wide Web schuf Tim Berners-Lee 1989 im Labor CERN in der Schweiz. Die erste WWW-Seite ging 1991 online."})}</div></div>
<div class="res"><div class="t"><span class="num">2</span>${L({pl:"Internet a WWW – czym się różnią?",de:"Internet und WWW – worin unterscheiden sie sich?"})}</div><div class="u">informatyka-szkola-przyklad.pl</div><div class="d">${L({pl:"Internet to sieć łącząca komputery, powstała wcześniej (ARPANET, 1969). WWW to jedna z usług działających w internecie, obok np. poczty e-mail.",de:"Das Internet ist ein Netz, das Computer verbindet; es entstand früher (ARPANET, 1969). Das WWW ist einer der Dienste im Internet, neben z. B. E-Mail."})}</div></div>
<div class="res"><div class="t"><span class="num">3</span>${L({pl:"Kto wymyślił internet??? – forum",de:"Wer hat das Internet erfunden??? – Forum"})}</div><div class="u">forum-gracze-przyklad.pl › watek</div><div class="d">${L({pl:"kuba_2011: chyba Bill Gates, bo przecież założył Microsoft xD",de:"kuba_2011: wahrscheinlich Bill Gates, der hat doch Microsoft gegründet xD"})}</div></div></div>`,
  parts:[
   {type:"multi", label:"a)", q:{pl:"Które zdania w przeglądzie od AI są nieprawdziwe? Zaznacz wszystkie.",de:"Welche Sätze in der KI-Übersicht sind falsch? Tippe alle an."},
    options:[{t:{pl:"„World Wide Web wymyślił Bill Gates w 1995 roku, gdy pracował w Microsofcie.”",de:"„Das WWW hat Bill Gates 1995 erfunden, als er bei Microsoft arbeitete.“"},ok:1},
             {t:{pl:"„Tim Berners-Lee stworzył WWW w 1989 roku.” (wynik 1)",de:"„Tim Berners-Lee schuf das WWW 1989.“ (Ergebnis 1)"},ok:0},
             {t:{pl:"„WWW i internet to dokładnie to samo – dwie nazwy jednej sieci.”",de:"„WWW und Internet sind genau dasselbe – zwei Namen für ein Netz.“"},ok:1},
             {t:{pl:"„Internet powstał wcześniej niż WWW.” (wynik 2)",de:"„Das Internet ist älter als das WWW.“ (Ergebnis 2)"},ok:0}]},
   {type:"single", label:"a)", q:{pl:"Jak jest naprawdę? Kto, kiedy i gdzie stworzył WWW?",de:"Wie ist es wirklich? Wer hat das WWW wann und wo geschaffen?"},
    options:[{t:{pl:"Bill Gates, 1995, Microsoft (USA)",de:"Bill Gates, 1995, Microsoft (USA)"},ok:0},
             {t:{pl:"Tim Berners-Lee, 1989, CERN (Szwajcaria)",de:"Tim Berners-Lee, 1989, CERN (Schweiz)"},ok:1},
             {t:{pl:"Steve Jobs, 1969, ARPANET (USA)",de:"Steve Jobs, 1969, ARPANET (USA)"},ok:0},
             {t:{pl:"Mark Zuckerberg, 2004, Facebook",de:"Mark Zuckerberg, 2004, Facebook"},ok:0}]},
   {type:"single", label:"a)", q:{pl:"Jak jest naprawdę z internetem i WWW?",de:"Wie ist es wirklich mit Internet und WWW?"},
    options:[{t:{pl:"To dokładnie to samo.",de:"Das ist genau dasselbe."},ok:0},
             {t:{pl:"WWW jest starsze niż internet.",de:"Das WWW ist älter als das Internet."},ok:0},
             {t:{pl:"Internet to sieć łącząca komputery, a WWW to jedna z usług w internecie (obok np. e-maila).",de:"Das Internet ist das Netz, das Computer verbindet. Das WWW ist einer der Dienste im Internet (neben z. B. E-Mail)."},ok:1}]},
   {type:"single", label:"b)", q:{pl:"Któremu z trzech wyników ufasz najmniej?",de:"Welchem der drei Ergebnisse vertraust du am wenigsten?"},
    options:[{t:{pl:"Wynik 1 – encyklopedia",de:"Ergebnis 1 – Enzyklopädie"},ok:0},{t:{pl:"Wynik 2 – strona szkolna",de:"Ergebnis 2 – Schulseite"},ok:0},{t:{pl:"Wynik 3 – forum",de:"Ergebnis 3 – Forum"},ok:1}]},
   {type:"multi", label:"b)", q:{pl:"Uzasadnij: dlaczego? Zaznacz wszystkie dobre powody.",de:"Begründe: Warum? Tippe alle guten Gründe an."},
    options:[{t:{pl:"Pisze anonimowy użytkownik forum.",de:"Ein anonymer Forumsnutzer schreibt das."},ok:1},
             {t:{pl:"Wpis jest najkrótszy.",de:"Der Eintrag ist am kürzesten."},ok:0},
             {t:{pl:"Tylko zgaduje („chyba”) i nie podaje żadnego źródła.",de:"Er rät nur („wahrscheinlich“) und nennt keine Quelle."},ok:1},
             {t:{pl:"Żartuje („xD”) i myli internet z WWW.",de:"Er macht Witze („xD“) und verwechselt Internet und WWW."},ok:1}]},
   {type:"multi", label:"c)", q:{pl:"Dlaczego AI mogło podać błędną odpowiedź? Zaznacz wszystkie możliwe powody.",de:"Warum konnte die KI falsch antworten? Tippe alle möglichen Gründe an."},
    options:[{t:{pl:"AI może coś „zmyślić” (halucynacja), gdy czegoś dokładnie nie wie.",de:"Die KI kann sich etwas „ausdenken“ (halluzinieren), wenn sie es nicht genau weiß."},ok:1},
             {t:{pl:"AI zawsze ma rację – to wyszukiwarka się pomyliła.",de:"Die KI hat immer recht – die Suchmaschine hat sich geirrt."},ok:0},
             {t:{pl:"AI mogło się uczyć z błędnych źródeł, np. z forów.",de:"Die KI kann aus falschen Quellen gelernt haben, z. B. aus Foren."},ok:1},
             {t:{pl:"AI samo nie sprawdza, czy informacja jest prawdziwa.",de:"Die KI prüft nicht selbst nach, ob etwas stimmt."},ok:1}]}],
  explain:{
    pl:`<p><b>a) Dwa błędy AI:</b></p><ol>
<li>WWW nie wymyślił Bill Gates, tylko <b>Tim Berners-Lee</b>, w <b>1989</b> roku w <b>CERN w Szwajcarii</b> – nie w 1995 i nie w Microsofcie.</li>
<li>WWW i internet to <b>nie to samo</b>. Internet to sieć, która łączy komputery (starsza, ARPANET 1969). WWW (strony internetowe) to tylko jedna z usług w internecie, tak jak e-mail.</li></ol>
<p><b>b)</b> Najmniej można ufać <b>wpisowi z forum</b>: anonimowy użytkownik tylko zgaduje („chyba”), nie podaje źródła, pisze „xD” i myli internet z WWW.</p>
<p><b>c)</b> Możliwe powody: AI może coś zmyślić (halucynacja), mogło uczyć się z błędnych źródeł (np. z forów), samo nie sprawdza, czy informacja jest prawdziwa.</p>
<p class="note">Zapamiętaj: odpowiedzi AI zawsze porównuj z pewnymi źródłami. Na egzaminie w c) wystarczy jeden powód.</p>`,
    de:`<p><b>a) Die zwei Fehler der KI:</b></p><ol>
<li>Nicht Bill Gates hat das WWW erfunden, sondern <b>Tim Berners-Lee</b>, im Jahr <b>1989</b> am <b>CERN in der Schweiz</b> – nicht 1995 und nicht bei Microsoft.</li>
<li>WWW und Internet sind <b>nicht dasselbe</b>. Das Internet ist das Netz, das Computer verbindet (älter, ARPANET 1969). Das WWW (die Webseiten) ist nur ein Dienst im Internet, so wie E-Mail.</li></ol>
<p><b>b)</b> Am wenigsten vertrauenswürdig ist der <b>Forumseintrag</b>: Ein anonymer Nutzer rät nur („wahrscheinlich“), nennt keine Quelle, schreibt „xD“ und verwechselt Internet und WWW.</p>
<p><b>c)</b> Mögliche Gründe: Die KI kann sich etwas ausdenken („halluzinieren“), sie kann aus falschen Quellen gelernt haben (z. B. aus Foren), und sie prüft nicht selbst nach, ob etwas stimmt.</p>
<p class="note">Merke: KI-Antworten immer mit zuverlässigen Quellen vergleichen. In der Prüfung reicht bei c) ein Grund.</p>`}},

{ pts:4, title:{pl:"Jednostki informacji",de:"Informationseinheiten"},
  parts:[{type:"inputs", q:{pl:"Uzupełnij wartości jednostek informacji.",de:"Ergänze die Werte der Informationseinheiten."},
    rows:[{post:{pl:"bitów = 1 bajt",de:"Bit = 1 Byte"},ans:["8"]},
          {post:{pl:"bajtów = 1 gigabajt",de:"Byte = 1 Gigabyte"},ans:["1073741824"],alt:["1000000000"],show:"1 073 741 824"},
          {post:{pl:"megabajtów = 1 gigabajt",de:"Megabyte = 1 Gigabyte"},ans:["1024"],alt:["1000"]},
          {post:{pl:"gigabajtów = 1 terabajt",de:"Gigabyte = 1 Terabyte"},ans:["1024"],alt:["1000"]}]}],
  explain:{
    pl:`<ul><li><b>8</b> bitów = 1 bajt</li><li><b>1 073 741 824</b> bajtów = 1 gigabajt (1024 · 1024 · 1024)</li><li><b>1024</b> megabajty = 1 gigabajt</li><li><b>1024</b> gigabajty = 1 terabajt</li></ul>
<p>Komputer liczy w systemie dwójkowym, dlatego każdy kolejny stopień to <b>×1024</b> (= 2<sup>10</sup>): bajt → KB → MB → GB → TB.</p>
<p class="note">Czasem liczy się też po 1000 (1 GB = 1 000 000 000 bajtów), np. na pudełkach dysków. Ta odpowiedź też jest tu zaliczona. Jeśli nie wiesz, której wersji oczekuje nauczyciel, zapytaj go.</p>`,
    de:`<ul><li><b>8</b> Bit = 1 Byte</li><li><b>1 073 741 824</b> Byte = 1 Gigabyte (1024 · 1024 · 1024)</li><li><b>1024</b> Megabyte = 1 Gigabyte</li><li><b>1024</b> Gigabyte = 1 Terabyte</li></ul>
<p>Computer rechnen im Zweiersystem. Deshalb ist jede Stufe <b>×1024</b> (= 2<sup>10</sup>): Byte → KB → MB → GB → TB.</p>
<p class="note">Manchmal rechnet man auch mit 1000 (1 GB = 1 000 000 000 Byte), z. B. auf Festplatten-Verpackungen. Das wird hier auch als richtig gezählt. Wenn du unsicher bist, frag die Lehrkraft, welche Variante sie erwartet.</p>`}},

{ pts:4, title:{pl:"Program Oli: „Suma: 23”",de:"Olas Programm: „Summe: 23“"},
  intro:()=>`<p>${L({pl:"Ola wpisała w programie liczby 2 i 3. Zamiast „Suma: 5” program wypisał „Suma: 23”.",de:"Ola hat die Zahlen 2 und 3 eingegeben. Statt „Summe: 5“ hat das Programm „Summe: 23“ ausgegeben."})}</p>${pre(codeOla)}`,
  parts:[
   {type:"single", q:{pl:"Dlaczego program wypisał 23?",de:"Warum kam 23 heraus?"},
    options:[{t:{pl:"Ola wpisała liczby w złej kolejności.",de:"Ola hat die Zahlen in der falschen Reihenfolge eingegeben."},ok:0},
             {t:{pl:"input() zwraca zawsze tekst. „2” + „3” to sklejenie tekstów, więc wychodzi „23”.",de:"input() liefert immer Text. „2“ + „3“ hängt Texte aneinander, deshalb kommt „23“ heraus."},ok:1},
             {t:{pl:"Komputer źle dodaje małe liczby.",de:"Der Computer rechnet bei kleinen Zahlen falsch."},ok:0},
             {t:{pl:"print() zawsze wypisuje liczby obok siebie.",de:"print() schreibt Zahlen immer nebeneinander."},ok:0}]},
   {type:"single", q:{pl:"Który program jest poprawny?",de:"Welches Programm ist richtig?"},
    options:[{code:codeOlaV2,ok:0},{code:codeOlaFix,ok:1},{code:codeOlaV3,ok:0}]}],
  explain:{
    pl:`<p><b>Dlaczego „23”?</b> <code>input()</code> zawsze zwraca <b>tekst</b>, nawet gdy wpiszesz liczbę. Dla tekstów <code>+</code> oznacza „sklej”: "2" + "3" = "23".</p>
<p><b>Poprawka:</b> zamień tekst na liczbę całkowitą funkcją <code>int()</code>:</p>${pre(codeOlaFix)}
<p>Teraz <code>a + b</code> naprawdę liczy: 2 + 3 = 5.</p>
<ul><li>Wersja z <code>int(a + b)</code> jest zła: najpierw skleja "23", potem robi z tego liczbę 23.</li><li>Wersja z <code>int()</code> tylko przy <code>a</code> daje błąd: nie można dodać liczby i tekstu.</li></ul>
<p class="note">Na egzaminie: wyjaśnij błąd <b>i</b> napisz poprawiony program.</p>`,
    de:`<p><b>Warum „23“?</b> <code>input()</code> liefert immer <b>Text</b>, auch wenn man eine Zahl eintippt. Bei Text bedeutet <code>+</code> „aneinanderhängen“: "2" + "3" = "23".</p>
<p><b>Lösung:</b> Den Text mit <code>int()</code> in eine ganze Zahl umwandeln:</p>${pre(codeOlaFix)}
<p>Jetzt rechnet <code>a + b</code> wirklich: 2 + 3 = 5.</p>
<ul><li>Die Variante mit <code>int(a + b)</code> ist falsch: Sie hängt erst "23" zusammen und macht daraus dann die Zahl 23.</li><li>Die Variante mit <code>int()</code> nur bei <code>a</code> gibt einen Fehler: Zahl und Text kann man nicht addieren.</li></ul>
<p class="note">In der Prüfung: den Fehler erklären <b>und</b> das verbesserte Programm aufschreiben.</p>`}},

{ pts:3, title:{pl:"Aplikacja „Latarka”",de:"App „Taschenlampe“"},
  intro:()=>`<p>${L({pl:"Instalujesz aplikację „Latarka”. Prosi o dostęp do: aparatu (lampy błyskowej), kontaktów, mikrofonu i lokalizacji.",de:"Du installierst die App „Taschenlampe“. Sie will Zugriff auf: Kamera (Blitzlicht), Kontakte, Mikrofon und Standort."})}</p>`,
  parts:[
   {type:"multi", label:"a)", chips:true, q:{pl:"Które uprawnienia są jej naprawdę potrzebne?",de:"Welche Berechtigungen braucht sie wirklich?"},
    options:[{t:{pl:"aparat (lampa błyskowa)",de:"Kamera (Blitzlicht)"},ok:1},{t:{pl:"kontakty",de:"Kontakte"},ok:0},{t:{pl:"mikrofon",de:"Mikrofon"},ok:0},{t:{pl:"lokalizacja",de:"Standort"},ok:0}]},
   {type:"single", label:"b)", q:{pl:"Co zrobisz z pozostałymi i dlaczego?",de:"Was machst du mit den anderen und warum?"},
    options:[{t:{pl:"Zezwolę na wszystko, żeby aplikacja działała szybciej.",de:"Ich erlaube alles, damit die App schneller läuft."},ok:0},
             {t:{pl:"Zezwolę, bo każda aplikacja tego potrzebuje.",de:"Ich erlaube es, weil jede App das braucht."},ok:0},
             {t:{pl:"Odmówię – latarka ich nie potrzebuje, a aplikacja mogłaby zbierać i sprzedawać moje dane.",de:"Ich lehne ab – eine Taschenlampe braucht das nicht, und die App könnte meine Daten sammeln und verkaufen."},ok:1}]}],
  explain:{
    pl:`<p><b>a)</b> Tylko <b>aparat (lampa błyskowa)</b> – latarka potrzebuje tylko światła.</p>
<p><b>b)</b> Kontakty, mikrofon i lokalizację <b>odrzucam</b> (nie zezwalam). Latarka ich nie potrzebuje. Z tymi uprawnieniami aplikacja mogłaby kopiować kontakty, podsłuchiwać, śledzić, gdzie jesteś, i sprzedawać te dane.</p>
<p class="note">Zasada: daj aplikacji tylko te uprawnienia, których naprawdę potrzebuje. Jeśli bez nich nie działa – usuń ją i wybierz inną.</p>`,
    de:`<p><b>a)</b> Nur die <b>Kamera (Blitzlicht)</b> – die Taschenlampe braucht nur das Licht.</p>
<p><b>b)</b> Kontakte, Mikrofon und Standort <b>ablehnen</b>. Eine Taschenlampe braucht sie nicht. Mit diesen Rechten könnte die App deine Kontakte kopieren, mithören, verfolgen, wo du bist, und die Daten verkaufen.</p>
<p class="note">Regel: Gib einer App nur die Rechte, die sie wirklich braucht. Funktioniert sie ohne nicht, lösche sie und nimm eine andere.</p>`}},

{ pts:4, title:{pl:"Algorytm: pole kwadratu",de:"Algorithmus: Fläche eines Quadrats"},
  intro:()=>`<p>${L({pl:"Algorytm w formie listy kroków ma obliczyć pole kwadratu (pole = a * a). Jeśli użytkownik poda a <= 0, ma dostać komunikat o błędzie.",de:"Ein Algorithmus als Schrittliste soll die Fläche eines Quadrats berechnen (Fläche = a * a). Gibt der Benutzer a <= 0 ein, soll er eine Fehlermeldung bekommen."})}</p>`,
  parts:[{type:"order",
    items:{pl:["Start","Wczytaj długość boku a.","Jeżeli a <= 0: wypisz „Błąd: a musi być większe od 0” i przejdź do końca.","Oblicz pole = a * a.","Wypisz pole.","Koniec"],
           de:["Start","Lies die Seitenlänge a ein.","Wenn a <= 0: gib „Fehler: a muss größer als 0 sein“ aus und gehe zum Ende.","Berechne Fläche = a * a.","Gib die Fläche aus.","Ende"]}}],
  explain:{
    pl:`<p><b>Dobra kolejność:</b></p><ol><li>Start</li><li>Wczytaj długość boku a.</li><li>Jeżeli a <= 0: wypisz „Błąd: a musi być większe od 0” i przejdź do końca.</li><li>Oblicz pole = a * a.</li><li>Wypisz pole.</li><li>Koniec</li></ol>
<p>Ważne: <b>najpierw</b> sprawdź, czy a <= 0, <b>potem</b> licz. Bok kwadratu nie może być zerowy ani ujemny.</p>
<p class="note">Na egzaminie piszesz kroki sam – ponumerowane, każdy krok w osobnej linii.</p>`,
    de:`<p><b>Richtige Reihenfolge:</b></p><ol><li>Start</li><li>Lies die Seitenlänge a ein.</li><li>Wenn a <= 0: gib „Fehler: a muss größer als 0 sein“ aus und gehe zum Ende.</li><li>Berechne Fläche = a * a.</li><li>Gib die Fläche aus.</li><li>Ende</li></ol>
<p>Wichtig: <b>Erst</b> prüfen, ob a <= 0 ist, <b>dann</b> rechnen. Eine Quadratseite kann nicht null oder negativ sein.</p>
<p class="note">In der Prüfung schreibst du die Schritte selbst auf – nummeriert, jeder Schritt in eine eigene Zeile.</p>`}},

{ pts:3, computer:true, title:{pl:"Systemy liczbowe",de:"Zahlensysteme"},
  parts:[{type:"inputs", q:{pl:"Przelicz liczby (kalkulator w trybie „Programista”).",de:"Rechne die Zahlen um (Rechner im Modus „Programmierer“)."},
    rows:[{pre:"2026<sub>(10)</sub> =",post:"<sub>(2)</sub>",ans:["11111101010"]},
          {pre:"6767<sub>(10)</sub> =",post:"<sub>(16)</sub>",ans:["1A6F"]},
          {pre:"101010<sub>(2)</sub> =",post:"<sub>(10)</sub>",ans:["42"]},
          {pre:"11111111<sub>(2)</sub> =",post:"<sub>(16)</sub>",ans:["FF"]},
          {pre:"C0DE<sub>(16)</sub> =",post:"<sub>(10)</sub>",ans:["49374"]},
          {pre:"404<sub>(16)</sub> =",post:"<sub>(2)</sub>",ans:["10000000100"]}]}],
  explain:{
    pl:`<ul class="mono"><li>2026 → 11111101010</li><li>6767 → 1A6F</li><li>101010 → 42</li><li>11111111 → FF</li><li>C0DE → 49374</li><li>404 → 10000000100</li></ul>
<p><b>Jak to zrobić:</b> otwórz Kalkulator w Windows → menu ☰ → <b>Programista</b>. Dotknij HEX, DEC, OCT albo BIN, wpisz liczbę i odczytaj pozostałe wiersze.</p>
<p>Przykład bez kalkulatora: 101010<sub>(2)</sub> = 32 + 8 + 2 = 42.</p>
<p class="note">Uwaga: w „C0DE” jest zero, nie litera O. Kalkulator pokazuje liczby dwójkowe w grupach po 4 (np. 0111 1110 1010) – zera na początku pomiń.</p>`,
    de:`<ul class="mono"><li>2026 → 11111101010</li><li>6767 → 1A6F</li><li>101010 → 42</li><li>11111111 → FF</li><li>C0DE → 49374</li><li>404 → 10000000100</li></ul>
<p><b>So geht's:</b> Windows-Rechner öffnen → Menü ☰ → <b>Programmierer</b>. HEX, DEC, OCT oder BIN antippen, Zahl eingeben, die anderen Zeilen ablesen.</p>
<p>Beispiel ohne Rechner: 101010<sub>(2)</sub> = 32 + 8 + 2 = 42.</p>
<p class="note">Achtung: In „C0DE“ steht eine Null, kein O. Der Rechner zeigt Binärzahlen in Vierergruppen (z. B. 0111 1110 1010) – Nullen am Anfang weglassen.</p>`}},

  explain:{
    pl:`<p><b>Poprawny program:</b></p>${pre(code9ok)}<ul>
<li><code>int()</code> zamienia wpisany tekst na liczbę.</li>
<li><code>if … else</code> to instrukcja warunkowa: jeśli a <= 0 → ERROR, w przeciwnym razie licz.</li>

    de:`<p><b>Richtiges Programm:</b></p>${pre(code9ok)}<ul>
<li><code>int()</code> macht aus dem eingegebenen Text eine Zahl.</li>
<li><code>if … else</code> ist die bedingte Anweisung: Wenn a <= 0 → ERROR, sonst rechnen.</li>
<li>Die Zeilen unter <code>if</code> und <code>else</code> müssen <b>eingerückt</b> sein (4 Leerzeichen) – das ist in Python wichtig.</li>

// ---------- state ----------
const KEY = "o07-state-v2";
let S = null;
function fresh(){ return { view:"home", unit:0, cur:0, ans:{}, perm:{}, qc:{}, solved:{}, submitted:false, score:{} }; }
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { S = null; }
if (!S || typeof S !== "object" || !S.ans || !S.view) S = fresh();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const tk = (ti,pi) => "t"+ti+"_"+pi, uk = (ui,qi) => "u"+ui+"_"+qi;
function perm(key, n){
  if (!S.perm[key] || S.perm[key].length !== n){
    const a = [...Array(n).keys()];
    for (let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    S.perm[key] = a;
  }
  return S.perm[key];
}
const norm = s => String(s||"").toUpperCase().replace(/^0X/,"").replace(/[\s.,'’_]/g,"").replace(/^0+(?=.)/,"");

// ---------- scoring ----------
function partResult(p, a){
  if (p.type === "match"){ let g=0; p.answer.forEach((x,i)=>{ if(a && a[i]===x) g++; }); return [g,8]; }
  if (p.type === "inputs"){ let g=0; p.rows.forEach((r,i)=>{ const v=norm(a&&a[i]); if(r.ans.map(norm).includes(v)||(r.alt||[]).map(norm).includes(v)) g++; }); return [g,p.rows.length]; }
  if (p.type === "single"){ return [a!=null && p.options[a] && p.options[a].ok ? 1:0, 1]; }
  if (p.type === "multi"){ const sel=new Set(a||[]); const ok=p.options.every((o,i)=>!!o.ok===sel.has(i)); return [ok?1:0,1]; }
  if (p.type === "atleast"){ const sel=a||[]; const ok = sel.length>=p.min && sel.every(i=>p.options[i].ok); return [ok?1:0,1]; }
  if (p.type === "order"){ const n=L(p.items).length; const ok=(a||[]).length===n && a.every((x,i)=>x===i); return [ok?1:0,1]; }
  return [0,1];
}
const isRight = (p,a) => { const [g,t]=partResult(p,a); return g===t; };
function hasAnswer(p,a){
  if (a==null) return false;
  if (Array.isArray(a)) return a.some(x => x!=="" && x!=null);
  return true;
}
function taskScore(ti){
  const t=TASKS[ti]; let g=0,tot=0;
  t.parts.forEach((p,pi)=>{ const [a,b]=partResult(p, S.ans[tk(ti,pi)]); g+=a; tot+=b; });
  return Math.round(t.pts * g / tot * 2) / 2;
}
const taskAnswered = ti => TASKS[ti].parts.some((p,pi)=>hasAnswer(p, S.ans[tk(ti,pi)]));
const totalScore = () => TASKS.reduce((s,t,i)=> s + (S.submitted ? (S.score[i]||0) : 0), 0);
const unitSolved = ui => UNITS[ui].qs.filter((q,qi)=>S.solved[uk(ui,qi)]).length;
const unitDone = ui => unitSolved(ui) === UNITS[ui].qs.length;
const allUnitsDone = () => UNITS.every((u,i)=>unitDone(i));
const exTotal = UNITS.reduce((s,u)=>s+u.qs.length,0);
const exSolved = () => UNITS.reduce((s,u,i)=>s+unitSolved(i),0);
const fmt = n => (Math.round(n*2)/2).toLocaleString(lang==="pl"?"pl-PL":"de-DE");

// ---------- render helpers ----------
const $ = id => document.getElementById(id);
const go = (patch) => { Object.assign(S, patch); save(); render(); window.scrollTo({top:0}); };
function btn(txt, cls, fn){ const b=document.createElement("button"); b.type="button"; b.className="btn "+(cls||""); b.textContent=txt; b.onclick=fn; return b; }

function renderHeader(){
  document.documentElement.lang = lang;
  $("title").innerHTML = `${esc(L(UI.title))}<small>${esc(L(UI.sub))}</small>`;
  $("lang-pl").setAttribute("aria-pressed", lang==="pl"); $("lang-de").setAttribute("aria-pressed", lang==="de");
  const sc=$("score");
  if (S.view==="test" && S.submitted) sc.textContent = `${L(UI.testL)}: ${fmt(totalScore())} / 40 ${L(UI.pts)}`;
  else if (S.view==="test") sc.textContent = `${L(UI.testL)}`;
  else sc.textContent = `${L(UI.exProg)}: ${exSolved()} / ${exTotal}`;
  const nav=$("nav"); nav.innerHTML=""; nav.hidden = S.view==="home";
  if (S.view==="home") return;
  const m=document.createElement("button"); m.type="button"; m.className="res"; m.textContent="☰ "+L(UI.menu); m.onclick=()=>go({view:"home"}); nav.appendChild(m);
  if (S.view==="unit"){
    UNITS.forEach((u,i)=>{
      const b=document.createElement("button"); b.type="button"; b.textContent=i+1; b.setAttribute("aria-label", `${L(UI.exercise)} ${i+1}`);
      if (S.unit===i) b.classList.add("cur");
      if (unitDone(i)) b.classList.add("done-ok"); else if (unitSolved(i)>0) b.classList.add("done-part");
      b.onclick=()=>go({unit:i}); nav.appendChild(b);
    });
  } else {
    TASKS.forEach((t,i)=>{
      const b=document.createElement("button"); b.type="button"; b.textContent=i+1; b.setAttribute("aria-label", `${L(UI.task)} ${i+1}`);
      if (S.cur===i) b.classList.add("cur");
      if (S.submitted) b.classList.add(S.score[i]===t.pts ? "done-ok" : "done-part");
      else if (taskAnswered(i)) b.classList.add("answered");
      b.onclick=()=>go({cur:i}); nav.appendChild(b);
    });
    const r=document.createElement("button"); r.type="button"; r.className="res"+(S.cur===10?" cur":""); r.textContent=S.submitted?L(UI.result):L(UI.submit);
    r.onclick=()=>go({cur:10}); nav.appendChild(r);
  }
}

function optBtn(html, cls, on, onClick, disabled){
  const b=document.createElement("button"); b.type="button"; b.className="opt "+cls+(on?" on":""); b.disabled=!!disabled;
  b.setAttribute("aria-pressed", on?"true":"false");
  b.innerHTML = `<span class="mk">${on?"✓":""}</span><span style="min-width:0;flex:1">${html}</span>`;
  b.onclick=onClick; return b;
}
const optHTML = o => o.code ? pre(o.code) : (o.mono ? `<span class="mono">${esc(L(o.t))}</span>` : esc(L(o.t)));

function renderPart(key, p, box, checked){
  let a=S.ans[key];
  const wrap=document.createElement("div"); wrap.className="part";
  if (p.q) wrap.insertAdjacentHTML("beforeend", `<div class="q">${p.label?`<span style="color:var(--accent)">${p.label}</span> `:""}${esc(L(p.q))}</div>`);
  if (p.code) wrap.insertAdjacentHTML("beforeend", pre(p.code));
  const set = v => { S.ans[key]=v; save(); render(); };

  if (p.type==="single" || p.type==="multi" || p.type==="atleast"){
    const multi = p.type!=="single";
    const holder=document.createElement("div"); holder.className = p.chips ? "chips" : "opts";
    const order = p.chips ? [...p.options.keys()] : perm(key, p.options.length);
    order.forEach(i=>{
      const o=p.options[i]; const on = multi ? (a||[]).includes(i) : a===i;
      let cls = multi ? "" : "radio";
      if (checked){ if (on && o.ok) cls+=" is-ok"; else if (on && !o.ok) cls+=" is-bad"; else if (!on && o.ok && p.type!=="atleast") cls+=" miss"; }
      holder.appendChild(optBtn(optHTML(o), cls, on, ()=>{
        if (multi){ const s=new Set(a||[]); s.has(i)?s.delete(i):s.add(i); set([...s]); } else set(i);
      }, checked));
    });
    wrap.appendChild(holder);
  }
  else if (p.type==="match"){
    const terms=L(p.terms), descs=L(p.descs);
    wrap.insertAdjacentHTML("beforeend", `<div class="match"><ol>${terms.map((t,i)=>`<li><b>${i+1})</b><span>${esc(t)}</span></li>`).join("")}</ol><ul>${descs.map((d,i)=>`<li><b>${"ABCDEFGH"[i]}.</b><span>${esc(d)}</span></li>`).join("")}</ul></div>`);
    const g=document.createElement("div"); g.className="mgrid";
    for (let i=0;i<8;i++){
      const c=document.createElement("div"); c.innerHTML=`<span>${i+1}</span>`;
      const sel=document.createElement("select"); sel.id=`${key}_m${i}`; sel.setAttribute("aria-label", `${i+1}`); sel.disabled=checked;
      sel.innerHTML = `<option value="">–</option>` + "ABCDEFGH".split("").map(x=>`<option${a&&a[i]===x?" selected":""}>${x}</option>`).join("");
      if (checked) sel.className = (a&&a[i]===p.answer[i]) ? "is-ok" : "is-bad";
      sel.onchange=()=>{ const v=(a||Array(8).fill("")).slice(); v[i]=sel.value; S.ans[key]=v; a=v; save(); renderHeader(); };
      c.appendChild(sel); g.appendChild(c);
    }
    wrap.appendChild(g);
    if (checked && !p.answer.every((x,i)=>a&&a[i]===x)) wrap.insertAdjacentHTML("beforeend", `<div class="fix">${L(UI.correctIs)} ${p.answer.map((x,i)=>`${i+1}–${x}`).join(", ")}</div>`);
  }
  else if (p.type==="inputs"){
    const g=document.createElement("div"); g.className="opts";
    p.rows.forEach((r,i)=>{
      const row=document.createElement("div"); row.className="inrow";
      if (r.pre) row.insertAdjacentHTML("beforeend", `<span>${L(r.pre)}</span>`);
      const inp=document.createElement("input"); inp.id=`${key}_i${i}`; inp.inputMode = r.text ? "text" : "numeric"; inp.autocomplete="off"; inp.autocapitalize="characters"; inp.spellcheck=false;
      inp.value=(a&&a[i])||""; inp.disabled=checked; inp.placeholder="…";
      inp.oninput=()=>{ const v=(a||Array(p.rows.length).fill("")).slice(); v[i]=inp.value; S.ans[key]=v; a=v; save(); };
      inp.onblur=()=>renderHeader();
      row.appendChild(inp);
      if (r.post) row.insertAdjacentHTML("beforeend", `<span>${L(r.post)}</span>`);
      if (checked){
        const v=norm(a&&a[i]); const main=r.ans.map(norm).includes(v); const alt=(r.alt||[]).map(norm).includes(v);
        inp.className = (main||alt) ? "is-ok" : "is-bad";
        if (alt) row.insertAdjacentHTML("beforeend", `<span class="fix">✓ (${L(UI.also)} ${r.show||r.ans[0]})</span>`);
        else if (!main) row.insertAdjacentHTML("beforeend", `<span class="fix">→ ${r.show||r.ans[0]}</span>`);
      }
      g.appendChild(row);
    });
    wrap.appendChild(g);
  }
  else if (p.type==="order"){
    const items=L(p.items); const seq=a||[]; const pm=perm(key, items.length);
    wrap.insertAdjacentHTML("beforeend", `<div class="section-label">${esc(L(UI.yourOrder))}</div>`);
    const list=document.createElement("div"); list.className="order-list";
    if (!seq.length) list.innerHTML=`<div class="empty">${esc(L(UI.none))}</div>`;
    seq.forEach((x,pos)=>{
      let cls=""; if (checked) cls = x===pos ? "is-ok" : "is-bad";
      const b=optBtn(esc(items[x]), cls, false, ()=>{ set(seq.filter((_,j)=>j!==pos)); }, checked);
      b.querySelector(".mk").remove(); list.appendChild(b);
    });
    wrap.appendChild(list);
    if (!checked){
      const rest=pm.filter(x=>!seq.includes(x));
      if (rest.length){
        wrap.insertAdjacentHTML("beforeend", `<div class="section-label">${esc(L(UI.tapOrder))}</div>`);
        const pool=document.createElement("div"); pool.className="order-pool";
        rest.forEach(x=>{ const b=optBtn(esc(items[x]), "", false, ()=>set([...seq,x])); b.querySelector(".mk").textContent="+"; pool.appendChild(b); });
        wrap.appendChild(pool);
      }
      if (seq.length){ const c=btn(L(UI.clear),"",()=>set([])); c.style.alignSelf="flex-start"; wrap.appendChild(c); }
    } else if (!isRight(p,a)) {
      wrap.insertAdjacentHTML("beforeend", `<div class="fix">${L(UI.correctIs)} ${items.map((t,i)=>`${i+1}. ${esc(t)}`).join(" · ")}</div>`);
    }
  }
  box.appendChild(wrap);
}

// ---------- views ----------
function renderHome(){
  const box=document.createElement("div"); box.style.cssText="display:flex;flex-direction:column;gap:16px";
  const c1=document.createElement("section"); c1.className="card";
  c1.insertAdjacentHTML("beforeend", `<div class="thead"><h2>${esc(L(UI.step1))}</h2><div class="pts">${exSolved()} / ${exTotal}</div></div><p style="margin:0;color:var(--muted)">${esc(L(UI.step1t))}</p>`);
  const grid=document.createElement("div"); grid.className="units";
  UNITS.forEach((u,i)=>{
    const s=unitSolved(i), n=u.qs.length;
    const b=document.createElement("button"); b.type="button"; b.className="unit"+(s===n?" done":"");
    b.innerHTML=`<span class="un">${s===n?"✓":i+1}</span><span class="ut">${esc(L(TASKS[i].title))}</span><span class="up"><i style="width:${Math.round(s/n*100)}%"></i></span><span class="uc">${s} / ${n}</span>`;
    b.onclick=()=>go({view:"unit", unit:i});
    grid.appendChild(b);
  });
  c1.appendChild(grid); box.appendChild(c1);

  const c2=document.createElement("section"); c2.className="card testcard";
  const done=allUnitsDone();
  c2.insertAdjacentHTML("beforeend", `<div class="thead"><h2>${esc(L(UI.step2))}</h2><div class="pts">${S.submitted?`${fmt(totalScore())} / 40 ${L(UI.pts)}`:`40 ${L(UI.pts)}`}</div></div><p style="margin:0;color:var(--muted)">${esc(L(UI.step2t))}</p><p class="note" style="margin:0">${esc(done?L(UI.ready):L(UI.testHint))}</p>`);
  const act=document.createElement("div"); act.className="actions";
  const started = TASKS.some((t,i)=>taskAnswered(i));
  act.appendChild(btn(S.submitted?L(UI.showRes):(started?L(UI.contTest):L(UI.startTest)), done||started||S.submitted?"primary":"", ()=>go({view:"test", cur:S.submitted?10:(started?S.cur:0)})));
  c2.appendChild(act); box.appendChild(c2);

  const reset=btn(L(UI.resetAll),"",null); reset.style.alignSelf="flex-start";
  let armed=false; reset.onclick=()=>{ if(!armed){ armed=true; reset.textContent=L(UI.sure); reset.classList.add("primary"); return; } S=fresh(); save(); render(); };
  box.appendChild(reset);
  return box;
}

function renderUnit(ui){
  const u=UNITS[ui];
  const card=document.createElement("section"); card.className="card";
  card.insertAdjacentHTML("beforeend", `<div class="thead"><h2><span>${L(UI.exercise)} ${ui+1}.</span>${esc(L(TASKS[ui].title))}</h2><div class="pts">${unitSolved(ui)} / ${u.qs.length}</div></div>`);
  u.qs.forEach((q,qi)=>{
    const key=uk(ui,qi), checked=!!S.qc[key];
    const qb=document.createElement("div"); qb.className="qbox"+(checked?(isRight(q,S.ans[key])?" ok":" bad"):"");
    qb.insertAdjacentHTML("beforeend", `<div class="qn">${qi+1}</div>`);
    const inner=document.createElement("div"); inner.className="qin";
    renderPart(key, q, inner, checked);
    if (checked){
      const right=isRight(q,S.ans[key]);
      inner.insertAdjacentHTML("beforeend", `<div class="verdict ${right?"ok":"bad"}">${right?"✓ "+esc(L(UI.good)):"✗ "+esc(L(UI.notYet))}</div><p class="tip"><b>${esc(L(UI.tipL))}</b> ${esc(L(q.tip))}</p>`);
      if (!right){ const r=btn(L(UI.tryAgain),"",()=>{ delete S.qc[key]; delete S.ans[key]; delete S.perm[key]; save(); render(); }); r.style.alignSelf="flex-start"; inner.appendChild(r); }
    } else {
      const c=btn(L(UI.check),"primary",()=>{ S.qc[key]=true; if (isRight(q,S.ans[key])) S.solved[key]=true; save(); render(); });
      c.style.alignSelf="flex-start"; inner.appendChild(c);
    }
    qb.appendChild(inner); card.appendChild(qb);
  });
  if (unitDone(ui)) card.insertAdjacentHTML("beforeend", `<div class="verdict ok">✓ ${esc(L(UI.unitDone))}</div>`);
  const act=document.createElement("div"); act.className="actions";
  if (ui>0) act.appendChild(btn(L(UI.prev),"",()=>go({unit:ui-1})));
  if (ui<9) act.appendChild(btn(L(UI.nextUnit), unitDone(ui)?"primary":"", ()=>go({unit:ui+1})));
  else act.appendChild(btn(L(UI.toTest), "primary", ()=>go({view:"home"})));
  card.appendChild(act);
  return card;
}

function renderTask(ti){
  const t=TASKS[ti], checked=S.submitted;
  const card=document.createElement("section"); card.className="card";
  if (t.computer) card.insertAdjacentHTML("beforeend", `<span class="pc">💻 ${esc(L(UI.computer))}</span>`);
  card.insertAdjacentHTML("beforeend", `<div class="thead"><h2><span>${ti+1}.</span>${esc(L(t.title))}</h2><div class="pts">${checked?fmt(S.score[ti]):"……"} / ${t.pts} ${L(UI.pts)}</div></div>`);
  if (t.intro) card.insertAdjacentHTML("beforeend", `<div class="part">${t.intro()}</div>`);
  t.parts.forEach((p,pi)=>renderPart(tk(ti,pi),p,card,checked));
  if (checked){
    const sc=S.score[ti]; const cls = sc===t.pts ? "ok" : sc>0 ? "part" : "bad";
    card.insertAdjacentHTML("beforeend", `<div class="verdict ${cls}">${cls==="ok"?"✓":cls==="part"?"◐":"✗"} ${esc(L(UI[cls]))} · ${fmt(sc)} / ${t.pts} ${L(UI.pts)}</div>`);
    card.insertAdjacentHTML("beforeend", `<div class="explain"><h3>${esc(L(UI.explain))}</h3>${L(t.explain)}</div>`);
  }
  const act=document.createElement("div"); act.className="actions";
  if (ti>0) act.appendChild(btn(L(UI.prev),"",()=>go({cur:ti-1})));
  act.appendChild(btn(ti<9?L(UI.next):(checked?L(UI.result):L(UI.finish)), "primary", ()=>go({cur:ti+1})));
  card.appendChild(act);
  return card;
}

function renderTestEnd(){
  const card=document.createElement("section"); card.className="card";
  if (!S.submitted){
    card.insertAdjacentHTML("beforeend", `<div class="thead"><h2>${esc(L(UI.submitTitle))}</h2></div><p style="margin:0">${esc(L(UI.submitText))}</p>`);
    let rows=""; TASKS.forEach((t,i)=>{ const a=taskAnswered(i); rows+=`<tr><td>${i+1}. ${esc(L(t.title))}</td><td style="color:${a?"var(--ok)":"var(--bad)"};font-family:var(--f-body)">${a?"✓ "+esc(L(UI.answered)):"○ "+esc(L(UI.open))}</td></tr>`; });
    card.insertAdjacentHTML("beforeend", `<table class="restable">${rows}</table>`);
    const act=document.createElement("div"); act.className="actions";
    act.appendChild(btn(L(UI.prev),"",()=>go({cur:9})));
    const sb=btn(L(UI.submit),"primary",null); let armed=false;
    sb.onclick=()=>{ if(!armed){ armed=true; sb.textContent=L(UI.submitSure); return; } S.submitted=true; TASKS.forEach((t,i)=>{ S.score[i]=taskScore(i); }); go({cur:10}); };
    act.appendChild(sb); card.appendChild(act);
    return card;
  }
  const tot=totalScore();
  card.insertAdjacentHTML("beforeend", `<div class="section-label">${esc(L(UI.resIntro))}</div><div class="big">${fmt(tot)} <span style="font-size:1.4rem;color:var(--muted)">/ 40 ${L(UI.pts)}</span></div><div class="bar2"><i style="width:${Math.round(tot/40*100)}%"></i></div>`);
  let rows=""; TASKS.forEach((t,i)=>{ rows+=`<tr><td>${i+1}. ${esc(L(t.title))}</td><td>${fmt(S.score[i])} / ${t.pts}</td></tr>`; });
  card.insertAdjacentHTML("beforeend", `<table class="restable">${rows}</table><p class="note" style="margin:0">${esc(L(UI.seeExpl))}</p>`);
  const act=document.createElement("div"); act.className="actions";
  const nb=btn(L(UI.newTest),"",null); let armed=false;
  nb.onclick=()=>{ if(!armed){ armed=true; nb.textContent=L(UI.sure); nb.classList.add("primary"); return; }
    Object.keys(S.ans).forEach(k2=>{ if(k2[0]==="t") delete S.ans[k2]; }); Object.keys(S.perm).forEach(k2=>{ if(k2[0]==="t") delete S.perm[k2]; });
    S.submitted=false; S.score={}; go({cur:0}); };
  act.appendChild(btn(L(UI.menu),"",()=>go({view:"home"}))); act.appendChild(nb); card.appendChild(act);
  return card;
}

function render(){
  renderHeader();
  const m=$("main"); m.innerHTML="";
  if (S.view==="home") m.appendChild(renderHome());
  else if (S.view==="unit") m.appendChild(renderUnit(S.unit));
  else m.appendChild(S.cur>=10 ? renderTestEnd() : renderTask(S.cur));
}
$("lang-pl").onclick=()=>{ lang="pl"; try{localStorage.setItem("o07-lang",lang);}catch(e){} render(); };
$("lang-de").onclick=()=>{ lang="de"; try{localStorage.setItem("o07-lang",lang);}catch(e){} render(); };
render();
})();
</script>

</body>
</html>
